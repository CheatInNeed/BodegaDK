spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bodegadk}
    username: ${SPRING_DATASOURCE_USERNAME:bodegadk}
    password: ${SPRING_DATASOURCE_PASSWORD:bodegadk}
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

bodegadk:
  push:
    public-key: ${BODEGADK_VAPID_PUBLIC_KEY:}
    private-key: ${BODEGADK_VAPID_PRIVATE_KEY:}
    subject: ${BODEGADK_VAPID_SUBJECT:mailto:admin@bodegadk.local}
