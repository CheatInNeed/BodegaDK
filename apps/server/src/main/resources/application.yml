spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 5000
      idle-timeout: 30000
      max-lifetime: 600000
      data-source-properties:
        prepareThreshold: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER}

server:
  port: 8080
  error:
    include-message: always

bodegadk:
  # Commit SHA baked into the Docker image by CI; "dev" for local runs.
  version: ${BODEGADK_VERSION:dev}
  push:
    public-key: ${BODEGADK_VAPID_PUBLIC_KEY:}
    private-key: ${BODEGADK_VAPID_PRIVATE_KEY:}
    subject: ${BODEGADK_VAPID_SUBJECT:mailto:admin@bodegadk.local}
