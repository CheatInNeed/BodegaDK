spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER}

server:
  port: 8080

bodegadk:
  push:
    public-key: ${BODEGADK_VAPID_PUBLIC_KEY:}
    private-key: ${BODEGADK_VAPID_PRIVATE_KEY:}
    subject: ${BODEGADK_VAPID_SUBJECT:mailto:admin@bodegadk.local}
