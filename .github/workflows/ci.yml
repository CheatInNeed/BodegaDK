name: CI

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build writes public/app-config.js and public/dist via tsc.
      # Supabase public config falls back to safe defaults in scripts/run-local-env.mjs,
      # so no secrets are required here.
      - name: Build web client
        run: npm run web:build

  server:
    name: Server (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Unit tests are Mockito-based and need no datasource.
      - name: Build and test
        working-directory: apps/server
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: apps/server/target/surefire-reports/
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build server image
        run: docker build -t bodegadk-server:ci apps/server
