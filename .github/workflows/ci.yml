name: CI

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on dev/master finish, so a newer
  # merge can never abort a deploy halfway through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Images are published and deployed only for merges into dev.
  DEPLOY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
  SERVER_IMAGE: ghcr.io/cheatinneed/bodegadk-server
  WEB_IMAGE: ghcr.io/cheatinneed/bodegadk-web

jobs:
  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build writes public/app-config.js and public/dist via tsc.
      # Supabase public config falls back to safe defaults in scripts/run-local-env.mjs,
      # so no secrets are required here.
      - name: Build web client
        run: npm run web:build

  server:
    name: Server (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Unit tests are Mockito-based and need no datasource.
      - name: Build and test
        working-directory: apps/server
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: apps/server/target/surefire-reports/
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    # infra-config too: the deploy ships docker-compose.yml and infra/monitoring/ as-is.
    needs: [web, server, infra-config]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build server image
        run: >
          docker build
          --build-arg APP_VERSION=${{ steps.tag.outputs.image_tag }}
          -t "$SERVER_IMAGE:${{ steps.tag.outputs.image_tag }}"
          apps/server

      - name: Build web image
        run: >
          docker build
          -f apps/web/Dockerfile
          -t "$WEB_IMAGE:${{ steps.tag.outputs.image_tag }}"
          .

      - name: Log in to GitHub Container Registry
        if: env.DEPLOY == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # One immutable tag per commit (what gets deployed) plus a moving
      # "dev" tag that always points at the newest build.
      - name: Push images
        if: env.DEPLOY == 'true'
        run: |
          tag="${{ steps.tag.outputs.image_tag }}"
          for image in "$SERVER_IMAGE" "$WEB_IMAGE"; do
            docker tag "$image:$tag" "$image:dev"
            docker push "$image:$tag"
            docker push "$image:dev"
          done

  migrate:
    name: Supabase migrations
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    # Shared with supabase-migrations.yml, which still handles master.
    concurrency:
      group: supabase-shared-db
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required secrets
        run: |
          for key in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required secret: $key"
              exit 1
            fi
          done

      - name: Link hosted Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Applies only migrations that are not yet in the remote history.
      - name: Apply migrations
        run: supabase db push --linked --include-all

  deploy:
    name: Deploy to dev server
    runs-on: ubuntu-latest
    needs: [docker, migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: read
    environment:
      name: dev
      url: http://130.225.170.77
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      DEPLOY_HOST: 130.225.170.77
      DEPLOY_USER: user
      DEPLOY_DIR: bodegadk-deploy
      IMAGE_TAG: ${{ needs.docker.outputs.image_tag }}
      # Short-lived job token; the host uses it for one `docker login` and logs out.
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Missing required secret: DEPLOY_SSH_KEY"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key: the job refuses to talk to anything else.
          cp infra/deploy/known_hosts ~/.ssh/known_hosts

      # infra/monitoring/ holds the config the optional monitoring profile mounts
      # (docs/devops/observability.md); it is copied even when the profile is off.
      - name: Copy deploy files
        run: >
          scp -o BatchMode=yes -r
          infra/docker-compose.yml infra/deploy/deploy.sh infra/monitoring
          "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"

      - name: Pull and restart containers
        run: >
          printf '%s' "$GHCR_TOKEN"
          | ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST"
          "GHCR_USER=$GITHUB_ACTOR bash $DEPLOY_DIR/deploy.sh $IMAGE_TAG"

      - name: Smoke test
        id: smoke
        run: |
          for attempt in $(seq 1 30); do
            body="$(curl -fsS --max-time 5 "http://$DEPLOY_HOST/api/health" || true)"
            echo "attempt $attempt: ${body:-no response}"
            if printf '%s' "$body" | grep -q "\"version\":\"$IMAGE_TAG\""; then
              echo "Version $IMAGE_TAG is live."
              exit 0
            fi
            sleep 5
          done
          echo "::error::$IMAGE_TAG did not become healthy within 150 seconds"
          exit 1

      - name: Roll back to previous version
        if: failure() && steps.smoke.outcome == 'failure'
        run: >
          printf '%s' "$GHCR_TOKEN"
          | ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST"
          "GHCR_USER=$GITHUB_ACTOR bash $DEPLOY_DIR/deploy.sh --rollback"

  infra-config:
    name: Infra and monitoring config
    runs-on: ubuntu-latest
    env:
      # Image versions must match infra/docker-compose.yml.
      PROMETHEUS_IMAGE: prom/prometheus:v3.15.0
      LOKI_IMAGE: grafana/loki:3.7.8
      ALLOY_IMAGE: grafana/alloy:v1.19.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml (including monitoring profile)
        working-directory: infra
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ci
          SPRING_DATASOURCE_USERNAME: ci
          SPRING_DATASOURCE_PASSWORD: ci
          SUPABASE_JWT_ISSUER: https://example.invalid/auth/v1
        run: docker compose --profile monitoring config --quiet

      - name: Validate docker-compose.yml with the local build override
        working-directory: infra
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ci
          SPRING_DATASOURCE_USERNAME: ci
          SPRING_DATASOURCE_PASSWORD: ci
          SUPABASE_JWT_ISSUER: https://example.invalid/auth/v1
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet

      - name: Validate nginx config
        run: |
          docker run --rm --add-host server:127.0.0.1 \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

      - name: Check Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/infra/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml

      - name: Unit-test alert rules
        run: |
          docker run --rm -v "$PWD/infra/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus \
            --entrypoint promtool "$PROMETHEUS_IMAGE" test rules alerts.test.yml

      - name: Validate Loki config
        run: |
          docker run --rm -v "$PWD/infra/monitoring/loki/loki.yml:/etc/loki/loki.yml:ro" \
            "$LOKI_IMAGE" -config.file=/etc/loki/loki.yml -verify-config

      - name: Validate Alloy config
        run: |
          docker run --rm -v "$PWD/infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro" \
            "$ALLOY_IMAGE" validate /etc/alloy/config.alloy

      - name: Validate Grafana dashboard JSON
        run: |
          for f in infra/monitoring/grafana/dashboards/*.json; do jq empty "$f" && echo "ok: $f"; done
