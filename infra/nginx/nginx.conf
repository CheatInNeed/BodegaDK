# One JSON line per request, so Loki/Grafana can filter by status and match $request_id with server logs.
log_format bodegadk_json escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method",'
  '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
  '"remote_addr":"$remote_addr","user_agent":"$http_user_agent"}';

server {
  listen 80;
  access_log /var/log/nginx/access.log bodegadk_json;

  # Always revalidate SPA shell so clients discover latest build quickly.
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;
  }

  # Revalidate compiled assets on refresh (keeps deploys visible without incognito).
  location /dist/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
    expires -1;
    try_files $uri =404;
  }

  # Web (statisk)
  location / {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;
    try_files $uri $uri/ /index.html;
  }

  # REST API -> backend
  location /api/ {
    # Keep explicit API prefix stripping: /api/rooms -> /rooms on backend.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # One ID per request, shared with the server's logs (see RequestIdFilter). Replaces any client-sent value.
    proxy_set_header X-Request-Id $request_id;
  }

  # WebSocket -> backend
  location /ws {
    proxy_pass http://server:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }
}
