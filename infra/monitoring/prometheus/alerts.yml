# Alert rules. They are evaluated by Prometheus and shown as firing/pending in Prometheus (/alerts)
# and in Grafana. No notifications are sent yet (no Alertmanager configured).
# Unit tests for these rules: alerts.test.yml (run with `promtool test rules`).
groups:
  - name: bodegadk
    rules:
      - alert: BodegaServerDown
        expr: up{job="bodegadk-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "BodegaDK server is not answering Prometheus"
          description: "The server has not responded on :8081/actuator/prometheus for 1 minute. Check `docker compose ps` and the server logs."

      - alert: BodegaHighServerErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="bodegadk-server", status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{job="bodegadk-server"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of REST requests fail with 5xx"
          description: "Look for 'Unexpected error handling' in the server logs (Grafana > Explore > Loki)."

      - alert: BodegaGameActionCrashed
        expr: sum by (game) (increase(bodegadk_game_action_seconds_count{outcome="crash"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "A {{ $labels.game }} game action crashed on the server"
          description: "Search the server logs for 'Game action' with level ERROR to find the room and stack trace."

      - alert: BodegaMatchHistoryWriteFailed
        expr: increase(bodegadk_match_history_failures_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A finished game's result could not be saved"
          description: "Players saw the result, but the match is missing from history/leaderboard. Check database connectivity."

      - alert: BodegaHeartbeatTimeoutSpike
        expr: sum(increase(bodegadk_heartbeat_timeouts_total[5m])) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Many players are dropping out (heartbeat timeouts)"
          description: "More than 20 heartbeat timeouts per 5 minutes. Often a network/proxy problem around /ws."

      - alert: BodegaJvmMemoryHigh
        # Share of the heap still in use right after garbage collection; near 1 means an OutOfMemoryError is close.
        expr: max(jvm_memory_usage_after_gc{job="bodegadk-server", area="heap"}) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Server heap is over 90% full even after garbage collection"
          description: "Possible memory leak (e.g. rooms never removed from memory). Compare with bodegadk_rooms."
