# Prometheus: collects numbers (metrics) from the server every 15 seconds and evaluates alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: bodegadk-server
    # Spring Boot Actuator on the internal management port (never exposed through nginx).
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["server:8081"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
